<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERIMAGE</title>
<meta name="description" content="AFTERIMAGE — 17 octobre 2027">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080b;
    --red: #c21d1d;
    --text: #e9e6e1;
    --muted: #7d8088;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #161a22 0%, var(--bg) 70%);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  canvas#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .flash { position: fixed; inset: 0; background: #cfd8ff; opacity: 0; pointer-events: none; z-index: 1; }
  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(28px, 6vh, 60px);
    padding: 24px 16px;
    text-align: center;
  }
  .logo {
    width: min(900px, 92vw);
    filter: drop-shadow(0 0 30px rgba(194, 29, 29, .35));
    animation: flicker 7s infinite;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .7; } 97% { opacity: 1; }
  }
  .countdown { display: flex; gap: clamp(10px, 3vw, 36px); flex-wrap: wrap; justify-content: center; }
  .unit {
    min-width: clamp(70px, 18vw, 150px);
    padding: 14px 8px 10px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(10, 12, 16, .55);
    backdrop-filter: blur(4px);
  }
  .num {
    font-family: Anton, Impact, sans-serif;
    font-size: clamp(40px, 10vw, 96px);
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-shadow: 3px 3px 0 var(--red);
  }
  .label {
    margin-top: 8px;
    font-size: clamp(10px, 1.6vw, 13px);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .date {
    font-family: Anton, Impact, sans-serif;
    letter-spacing: .35em;
    font-size: clamp(14px, 2.4vw, 22px);
    color: var(--red);
  }
  .sound {
    position: fixed; right: 16px; bottom: 16px; z-index: 3;
    font: 600 12px Inter, sans-serif; letter-spacing: .15em; text-transform: uppercase;
    color: var(--text); background: rgba(10,12,16,.7);
    border: 1px solid rgba(255,255,255,.15); padding: 10px 14px; cursor: pointer;
  }
  .sound:hover { border-color: var(--red); }
  .enter {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(5,6,8,.92); cursor: pointer;
    transition: opacity .8s;
  }
  .enter span { font-family: Anton, Impact, sans-serif; font-size: clamp(22px, 5vw, 40px); letter-spacing: .4em; color: var(--text); }
  .enter small { color: var(--muted); letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
  .enter.hidden { opacity: 0; pointer-events: none; }
  .done { font-family: Anton, Impact, sans-serif; font-size: clamp(36px, 8vw, 80px); color: var(--red); letter-spacing: .1em; }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="flash" id="flash"></div>

<main>
  <img class="logo" src="logo.png" alt="AFTERIMAGE">
  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="d">000</div><div class="label">Jours</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="label">Heures</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="label">Secondes</div></div>
  </div>
  <div class="date">17 · 10 · 2027</div>
</main>

<button class="sound" id="sound" aria-label="Activer ou couper le son">🔇 Son coupé</button>

<div class="enter" id="enter">
  <span>ENTRER</span>
  <small>Cliquez pour entendre la pluie</small>
</div>

<script>
// ---------- Compte à rebours jusqu'au 17 octobre 2027, 00:00 (heure de Paris) ----------
const target = new Date('2027-10-17T00:00:00+02:00').getTime();
const $ = id => document.getElementById(id);
const pad = (n, l = 2) => String(n).padStart(l, '0');
function tick() {
  let diff = Math.max(0, target - Date.now());
  const d = Math.floor(diff / 86400000); diff %= 86400000;
  const h = Math.floor(diff / 3600000);  diff %= 3600000;
  const m = Math.floor(diff / 60000);    diff %= 60000;
  const s = Math.floor(diff / 1000);
  if (target - Date.now() <= 0) {
    $('countdown').innerHTML = '<div class="done">C\'EST LE JOUR</div>';
    return;
  }
  $('d').textContent = pad(d, 3); $('h').textContent = pad(h);
  $('m').textContent = pad(m);    $('s').textContent = pad(s);
  setTimeout(tick, 1000 - (Date.now() % 1000));
}
tick();

// ---------- Pluie visuelle ----------
const cv = $('rain'), ctx = cv.getContext('2d');
let W, H, drops = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const count = Math.round(W * H / 4500);
  drops = Array.from({ length: count }, () => newDrop(true));
}
function newDrop(anyY) {
  const z = Math.random();              // profondeur
  return { x: Math.random() * (W + 200) - 100, y: anyY ? Math.random() * H : -20,
           len: 10 + z * 22, v: 9 + z * 16, a: .08 + z * .3 };
}
const wind = 1.6;
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.lineWidth = 1; ctx.lineCap = 'round';
  for (const p of drops) {
    ctx.strokeStyle = `rgba(180,195,220,${p.a})`;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + wind * p.len / 8, p.y + p.len); ctx.stroke();
    p.y += p.v; p.x += wind;
    if (p.y > H) Object.assign(p, newDrop(false));
  }
  requestAnimationFrame(draw);
}
addEventListener('resize', resize); resize(); draw();

// Éclairs occasionnels
function lightning() {
  const f = $('flash');
  f.animate([{ opacity: 0 }, { opacity: .18 }, { opacity: 0 }, { opacity: .1 }, { opacity: 0 }],
            { duration: 700, easing: 'ease-out' });
  if (audio) thunder();
  setTimeout(lightning, 15000 + Math.random() * 25000);
}
setTimeout(lightning, 9000);

// ---------- Bruit de pluie (généré en Web Audio, aucun fichier) ----------
let audio = null, master = null, on = false;
function noiseBuffer(ac, seconds, brown) {
  const len = ac.sampleRate * seconds, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c); let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
  }
  return buf;
}
function startAudio() {
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain(); master.gain.value = 0; master.connect(audio.destination);

  // Nappe de pluie : bruit blanc filtré
  const rain = audio.createBufferSource(); rain.buffer = noiseBuffer(audio, 4, false); rain.loop = true;
  const hp = audio.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
  const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
  const rg = audio.createGain(); rg.gain.value = 0.22;
  rain.connect(hp).connect(lp).connect(rg).connect(master); rain.start();

  // Grondement grave : bruit brun
  const rumble = audio.createBufferSource(); rumble.buffer = noiseBuffer(audio, 4, true); rumble.loop = true;
  const rl = audio.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 300;
  const rgn = audio.createGain(); rgn.gain.value = 0.5;
  rumble.connect(rl).connect(rgn).connect(master); rumble.start();

  // Gouttes individuelles
  const dropBuf = noiseBuffer(audio, 0.05, false);
  (function plink() {
    const t = audio.currentTime;
    const s = audio.createBufferSource(); s.buffer = dropBuf;
    const bp = audio.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random() * 4000; bp.Q.value = 4;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.15 + Math.random() * 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    const pan = audio.createStereoPanner(); pan.pan.value = Math.random() * 2 - 1;
    s.connect(bp).connect(g).connect(pan).connect(master); s.start(t);
    setTimeout(plink, 10 + Math.random() * 60);
  })();
}
function thunder() {
  if (!on) return;
  const t = audio.currentTime + 0.3 + Math.random();
  const s = audio.createBufferSource(); s.buffer = noiseBuffer(audio, 5, true);
  const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180;
  const g = audio.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1.6, t + 0.15);
  g.gain.exponentialRampToValueAtTime(0.001, t + 4.5);
  s.connect(f).connect(g).connect(master); s.start(t);
}
function setSound(v) {
  if (!audio) startAudio();
  if (audio.state === 'suspended') audio.resume();
  on = v;
  master.gain.cancelScheduledValues(audio.currentTime);
  master.gain.setValueAtTime(master.gain.value, audio.currentTime);
  master.gain.linearRampToValueAtTime(v ? 0.8 : 0, audio.currentTime + 1.2);
  $('sound').textContent = v ? '🔊 Pluie' : '🔇 Son coupé';
}
$('enter').addEventListener('click', () => { $('enter').classList.add('hidden'); setSound(true); });
$('sound').addEventListener('click', () => setSound(!on));
</script>
</body>
</html>
